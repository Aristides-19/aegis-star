<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aegis-Star 8-Sector</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <main>
    <h1>Aegis-Star 8-Sector</h1>
    <p>Ocho sensores. Una nave. Un tablero.</p>

    <!-- Backend contract: do not change action, method or name -->
    <form action="/register" method="post">
      <label for="email">Tu correo</label>
      <input type="email" id="email" name="email" required
             placeholder="tu@correo.com" autocomplete="email">
      <button type="submit">Avísame</button>
    </form>

    {% if message %}<p role="alert">{{ message }}</p>{% endif %}
  </main>

</body>
</html>
