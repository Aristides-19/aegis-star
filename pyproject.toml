[project]
name = "aegis-star"
version = "0.1.0"
description = "Sistema de detección y evasión en estrella (8 sectores)"
requires-python = ">=3.11"
dependencies = [
    "pydantic[email]>=2.0.0",
    "websockets>=12.0",
    "rich>=13.0.0",
    "fastapi>=0.163.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "ship", "sensor", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "standard"
enableTypeIgnoreComments = true
